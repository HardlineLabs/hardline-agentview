name: Product checks
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
jobs:
  pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run pwa:build
      - run: node scripts/pairing-smoke.mjs
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pwa:build
      - run: npx playwright install chromium webkit
      - run: npm run pwa:smoke
      - run: npm run package:host
      - run: node scripts/package-smoke.mjs
      - run: node scripts/window-smoke.mjs
        env:
          AGENTVIEW_PACKAGED_HOST: out/host/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-host
          path: out/host/
          retention-days: 7
